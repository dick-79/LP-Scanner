<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<title>LP Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: één kolom, grote opnameknop als plaat bovenaan, resultaten als lijst eronder */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --ink: #15181c;
  --muted: #5b6670;
  --line: #d5dae0;
  --accent: #f2b705;
  --on-accent: #15181c;
  --danger: #b42318;
  --disc: #16181b;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1114;
    --surface: #181b20;
    --ink: #eceff2;
    --muted: #98a3ad;
    --line: #2a2f36;
    --danger: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--body);
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
.top { display: flex; align-items: center; justify-content: space-between; }
h1 { font: 800 1.6rem/1 var(--display); letter-spacing: -0.02em; margin: 0; }
h2 { font: 800 1.25rem/1.15 var(--display); margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }

/* opnameknop */
.capture { display: grid; justify-items: center; gap: 14px; padding-top: 4px; }
.disc {
  position: relative; width: min(66vw, 260px); aspect-ratio: 1; border-radius: 50%;
  background: repeating-radial-gradient(circle at center, #131417 0 2px, #1d1f23 2px 4px);
  border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.disc::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 20deg, transparent 0 12%, rgba(255,255,255,.07) 14% 18%, transparent 20% 62%, rgba(255,255,255,.06) 64% 68%, transparent 70%); }
.disc .label { position: relative; width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; text-align: center; font: 800 .8rem/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.disc .label::after { content: ""; position: absolute; width: 7%; aspect-ratio: 1; border-radius: 50%; background: #131417; bottom: 14%; }
.disc:active { transform: scale(.98); }
.alt { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px; min-height: 44px; }

.status { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.status.error { border-color: var(--danger); color: var(--danger); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.found { grid-template-columns: 84px 1fr; align-items: start; }
.found img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.fields { display: grid; gap: 8px; min-width: 0; }
.fields label { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: grid; gap: 3px; }
.fields input { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-family: var(--body); text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 1rem; }
.primary { min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: 800 1rem var(--display); padding: 0 18px; }
.ghost { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: transparent; padding: 0 14px; }
.span-all { grid-column: 1 / -1; }

.results { display: grid; gap: 10px; }
.results h2 { padding-top: 4px; }
.res { display: grid; grid-template-columns: 64px 1fr; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; align-items: center; }
.res img, .res .noimg { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; background: var(--bg); }
.res b { display: block; overflow-wrap: anywhere; }
.meta { font: 400 .78rem/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

.detail { display: grid; gap: 16px; }
.hero { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
.hero img { width: 112px; height: 112px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.hero > div { min-width: 0; display: grid; gap: 6px; }
.price { display: grid; gap: 4px; }
.price .big { font: 500 2rem/1 var(--mono); letter-spacing: -0.02em; }
.price .big small { font-size: .85rem; color: var(--muted); letter-spacing: 0; }
table { width: 100%; border-collapse: collapse; font: 400 .9rem var(--mono); }
td { padding: 7px 0; border-top: 1px solid var(--line); }
td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
details summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
ol.tracks { margin: 0; padding-left: 1.6em; font-size: .92rem; }
.link { display: inline-flex; align-items: center; min-height: 48px; justify-content: center; text-decoration: none; }

dialog { width: min(92vw, 460px); border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 20px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog form { display: grid; gap: 14px; }
dialog p { margin: 0; font-size: .88rem; color: var(--muted); }
dialog a { color: var(--ink); }
.row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>LP Scanner</h1>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Instellingen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="wrap" style="gap:20px">
    <section class="capture" id="capture">
      <label class="disc" for="file-camera" aria-label="Foto van de hoes maken">
        <span class="label">Foto<br>maken</span>
      </label>
      <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
      <input id="file-gallery" type="file" accept="image/*" hidden>
      <label class="alt" for="file-gallery" role="button" tabindex="0" id="alt-gallery">Of kies een foto uit je galerij</label>
    </section>

    <div class="status" id="status" role="status" aria-live="polite" hidden></div>

    <section class="card found" id="found" hidden>
      <img id="preview" alt="Foto van de LP-hoes">
      <div class="fields">
        <label>Artiest<input id="f-artist" autocomplete="off"></label>
        <label>Titel<input id="f-title" autocomplete="off"></label>
      </div>
      <div class="fields span-all">
        <label>Catalogusnummer (optioneel)<input id="f-catno" autocomplete="off"></label>
      </div>
      <button class="primary span-all" id="btn-search" type="button">Zoek op Discogs</button>
    </section>

    <section class="results" id="results" hidden></section>
    <article class="card detail" id="detail" hidden></article>
  </main>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>Instellingen</h2>
    <p>De sleutels blijven alleen op deze telefoon staan en gaan alleen naar Anthropic en Discogs.</p>
    <label class="fields"><span class="meta">Discogs-token</span><input id="s-discogs" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p>Maak er een op <a href="https://www.discogs.com/settings/developers" target="_blank" rel="noopener">discogs.com/settings/developers</a> via "Generate new token".</p>
    <label class="fields"><span class="meta">Anthropic API-sleutel</span><input id="s-anthropic" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p>Maak er een op <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Een foto kost een paar cent.</p>
    <div class="row">
      <button class="ghost" value="cancel" type="submit">Annuleren</button>
      <button class="primary" id="s-save" value="save" type="submit">Opslaan</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
